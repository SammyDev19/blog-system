<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Post | Campus Blog</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                Campus<span>Blog</span>
            </a>

            <div class="nav-links">

                <a href="/">Home</a>

                <a href="/profile">Profile</a>

                <a href="/logout" class="logout-link">
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <main class="container">

        <section class="hero">

            <p class="eyebrow">
                CREATE
            </p>

            <h1>
                Write a new post
            </h1>

            <p class="hero-text">
                Share your thoughts, ideas, and stories
                with the Campus Blog community.
            </p>

        </section>


        <section class="card">

            {% if error %}

                <p class="error">
                    {{ error }}
                </p>

            {% endif %}


            <form method="POST">

                <label for="title">
                    Post Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter your post title"
                    required
                >


                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    placeholder="Write your post here..."
                    rows="12"
                    required
                ></textarea>


                <div class="actions">

                    <button type="submit">
                        Publish Post
                    </button>

                    <a
                        href="/"
                        class="primary-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Campus Blog
        </p>

    </footer>

</body>

</html>
