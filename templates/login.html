<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Campus Blog</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                Campus<span>Blog</span>
            </a>

            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                <a href="/register">
                    Register
                </a>

            </div>

        </div>

    </nav>


    <main class="container">

        <section class="auth-section">

            <div class="auth-card">

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1>
                    Login
                </h1>

                <p class="auth-subtitle">
                    Sign in to continue to Campus Blog.
                </p>


                {% if error %}

                    <p class="error">
                        {{ error }}
                    </p>

                {% endif %}


                <form method="POST">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="full-button"
                    >
                        Login
                    </button>

                </form>


                <p class="auth-footer">

                    Don't have an account?

                    <a href="/register">
                        Create one
                    </a>

                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Campus Blog
        </p>

    </footer>

</body>

</html>
